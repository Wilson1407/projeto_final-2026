<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato — Agência</title>

  <style>
    body { font-family: Arial; margin: 0; background: #f9f9f9; }
    header { background: #222; color: white; padding: 20px; text-align: center; }
    form {
      max-width: 450px;
      margin: 40px auto;
      padding: 20px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    /* Estilo dos campos do formulário */
    input, textarea {
      width: 100%; padding: 10px; margin-bottom: 15px;
      border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
    }
    button {
      background: #6c5ce7; color: #fff; border: none; padding: 10px 20px;
      border-radius: 6px; cursor: pointer; width: 100%;
    }
    button:hover { background: #553cde; }
    .msg { color: green; text-align: center; } /* Mensagem de sucesso */
  </style>
</head>
<body>

  <header>
    <h1>Fale Conosco</h1>
    <p><a href="index.html" style="color:#a29bfe;">← Voltar ao início</a></p>
  </header>

  <!-- Formulário de contato; a validação é feita em JavaScript abaixo -->
  <form id="formulario">
    <label>Nome:</label>
    <input type="text" id="nome" required><br>

    <label>E-mail:</label>
    <input type="email" id="email" required><br>

    <label>Mensagem:</label><br>
    <textarea id="mensagem" rows="4" style="width:100%" required></textarea><br>

    <button type="submit">Enviar mensagem</button>
  </form>

  <!-- Elemento onde será exibida a mensagem de confirmação -->
  <p id="resposta" class="msg"></p>

  <script>
    /*
      FUNÇÃO validarFormulario:
      Intercepta o envio do formulário (evento 'submit'),
      verifica se os campos foram preenchidos corretamente
      e mostra uma mensagem de confirmação simulada.
    */
    document.getElementById('form-contato').addEventListener('submit', function(evento) {
      // Impede o envio real do formulário (recarregaria a página)
      event.preventDefault();

      // Captura os valores digitados pelo usuário
      const nome = document.getElementById('campo-nome').value;
      const email = document.getElementById('campo-email').value;
      const mensagem = document.getElementById('campo-mensagem').value;

      // Verificação simples: nenhum campo pode ficar vazio
      if (nome === '' || mensagem === '') {
        alert('Por favor, preencha todos os campos!');
        return; // Interrompe a função aqui
      }

      // Exibe confirmação para o usuário (em um site real, enviaria ao servidor)
      document.getElementById('mensagem-enviada').textContent =
        'Obrigado, ' + nome + '! Sua mensagem foi recebida com sucesso.';
    });
  </script>

</body>
</html>
