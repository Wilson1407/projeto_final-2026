<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fliperama</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <link rel="stylesheet" href="style.css">

    <link rel="icon" type="image/png" href="./img/icone.png">

</head>
<body data-theme="dark"> 
    
    <div id="theme-switch-container">
        <button id="theme-switch-btn" aria-label="Trocar tema claro/escuro">
            <span class="material-symbols-rounded" id="theme-icon">
                dark_mode
            </span>
        </button>
    </div>

    <div class="container" id="app">
        <header>
            
            <a href="index.html" style="color: inherit; text-decoration: none;">
                <div class="brand">
                    <img src="/06-fliperama/img/icone.png" alt="Fliperama" width="25" height="25">

                    <div>
                        <h1>Fliperama</h1>
                        <p>Jogos Clássicos</p>
                    </div>
                </div>
            </a>

            <div class="searchbar" role="search">
                <input id="searchInput" type="search" placeholder="Busque por título, autor ou categoria..."/>
                <button id="searchBtn">Buscar</button>
            </div>
        </header>

        <div class="top">
            <aside class="filters">
                <h2>Categorias</h2>
                <div class="category-list" id="categoryList">
                    <div class="chip active" data-cat="todos">Todos</div>
                    <div class="chip" data-cat="pong">Pong</div>
                    <div class="chip" data-cat="snake">Snake</div>
                    <div class="chip" data-cat="space-invaders">Space Invaders</div>
                    </div>

                <div style="margin:12px 0;border-top:1px solid var(--border-color)"></div>
                <div>
                    <h2>Filtrar por</h2>
                    <p style="color:var(--text-muted);font-size:13px;margin:6px 0 0">Use a busca ou clique em uma categoria.</p>
                </div>
            </aside>

            <main>
                <section class="featured">
                    <div class="info">
                        <h3>Destaque do mês: Pong</h3>
                        <p>Confira</p>
                    </div>
                    <img src="/06-fliperama/img/pong.png" alt="Pong"/>
                    
                </section>

                <div class="controls" style="margin-top:14px">
                    <div class="left" id="resultCount">Exibindo 0 jogos</div>
                    <div class="right">
                        <label for="sortSelect" style="color:var(--text-muted);margin-right:8px">Ordenar:</label>
                        <select id="sortSelect">
                            <option value="title">Título (A–Z)</option>
                            <option value="author">Autor/Desenvolvedora</option>
                        </select>
                    </div>
                </div>

                <section style="margin-top:12px">
                    
                    <div class="grid" id="booksGrid" aria-live="polite">
                        </div>
                </section>
            </main>
        </div>

        <a href="../index.html" class="voltar">← Voltar para a Agência</a>

        <footer>
            © <span id="year"></span> Catálogo de jogos - Fliperama
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
